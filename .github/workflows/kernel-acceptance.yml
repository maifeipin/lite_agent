name: Kernel Acceptance Gates (Stage 3)

on:
  pull_request:
    branches:
      - main
      - 'codex/**'
  push:
    branches:
      - 'codex/kernel-acceptance'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Gate 1: 独立基础 Core Gate (零 Parser 依赖，独立运行)
  # -------------------------------------------------------------
  core-isolated-gate:
    name: 1. Core Isolated Gate (Zero Parser Dependency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite Agent
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Core Minimal Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r dev/requirements/core.txt pytest requests

      - name: 1.1 AST Architecture Boundaries Check
        run: python scripts/check_architecture.py

      - name: 1.2 Core Manifest & Export Defensive Security Tests (S3-A1)
        run: python -m unittest dev/tests/tooling/test_core_manifest_and_export.py dev/tests/tooling/test_export_safety.py -v

      - name: 1.3 Clean Core Environment Standalone Run Proof (S3-A2)
        run: python scripts/verify_core.py

      - name: 1.4 Verification Entry Arguments & Fail-Fast Tests (S3-C)
        run: python -m unittest dev/tests/tooling/test_verification_cli.py -v

      - name: 1.5 Git Format & Untracked Files Trailing Whitespace Check
        run: python -c "from scripts.verify import check_formatting; ok, msg = check_formatting('.'); assert ok, msg"

  # -------------------------------------------------------------
  # Gate 2: 前端独立 JavaScript 契约检查 (独立 Node.js 环境)
  # -------------------------------------------------------------
  frontend-gate:
    name: 2. Frontend JavaScript Contract Gate (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite Agent
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Review Meeting Frontend Scenarios
        run: node dev/tests/frontend/test_review_meeting_frontend.js

  # -------------------------------------------------------------
  # Gate 3: Agent 全量业务回归测试 (Python 3.13, 挂载固定 Parser, 0 Skip)
  # -------------------------------------------------------------
  agent-regression:
    name: 3. Agent Full Regression Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite Agent
        uses: actions/checkout@v4

      - name: Checkout Parser at Fixed Compatible SHA
        uses: actions/checkout@v4
        with:
          repository: 'maifeipin/mail-statement-parser'
          ref: 'fa3600d813d9b0b07171baf7c8ab9aeebc77d17d'
          token: ${{ secrets.PARSER_REPO_READ_TOKEN || github.token }}
          path: 'mail-statement-parser'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Agent Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev/requirements/full.txt -r dev/requirements/test.txt

      - name: Run Agent Full Pytest Suite (Scoped to tests/, Disallow Skipped Tests)
        env:
          MAIL_STATEMENT_PARSER_DIR: ${{ github.workspace }}/mail-statement-parser
        run: |
          python -m pytest -c dev/config/pytest.ini --rootdir=. dev/tests/ -q -p no:cacheprovider -p dev.tests.support.no_skips --tb=short

  # -------------------------------------------------------------
  # Gate 4: Parser 跨仓兼容回归 (固定兼容 SHA: fa3600d813d9b0b07171baf7c8ab9aeebc77d17d)
  # -------------------------------------------------------------
  parser-compat-regression:
    name: 4. Parser Cross-Repo Contract Regression (Fixed SHA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite Agent
        uses: actions/checkout@v4

      - name: Checkout Parser at Fixed Compatible SHA
        uses: actions/checkout@v4
        with:
          repository: 'maifeipin/mail-statement-parser'
          ref: 'fa3600d813d9b0b07171baf7c8ab9aeebc77d17d'
          token: ${{ secrets.PARSER_REPO_READ_TOKEN || github.token }}
          path: 'mail-statement-parser'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Fixed Parser SHA
        run: |
          cd mail-statement-parser
          PARSER_ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Actual Parser SHA: ${PARSER_ACTUAL_SHA}"
          if [ "${PARSER_ACTUAL_SHA}" != "fa3600d813d9b0b07171baf7c8ab9aeebc77d17d" ]; then
            echo "❌ 关键错误: Parser 提交哈希未锁定在已核准基线 fa3600d813d9b0b07171baf7c8ab9aeebc77d17d"
            exit 1
          fi

      - name: Install Parser Requirements
        run: |
          cd mail-statement-parser
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run Parser Test Suite
        run: |
          cd mail-statement-parser
          python -m unittest discover -s tests -q

  # -------------------------------------------------------------
  # Gate 5: Docker Python 3.9 只读隔离环境双回归
  # -------------------------------------------------------------
  docker-python39-isolation:
    name: 5. Docker Python 3.9 Sanitized Readonly Double Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite Agent
        uses: actions/checkout@v4

      - name: Checkout Parser at Fixed Compatible SHA
        uses: actions/checkout@v4
        with:
          repository: 'maifeipin/mail-statement-parser'
          ref: 'fa3600d813d9b0b07171baf7c8ab9aeebc77d17d'
          token: ${{ secrets.PARSER_REPO_READ_TOKEN || github.token }}
          path: 'mail-statement-parser'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Host Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev/requirements/full.txt -r dev/requirements/test.txt

      - name: Build Docker Python 3.9 Test Image
        run: |
          python -c "from scripts.verify import build_isolated_docker_image; assert build_isolated_docker_image('.')"

      - name: Run Sanitized Snapshot Double Regression
        env:
          MAIL_STATEMENT_PARSER_DIR: ${{ github.workspace }}/mail-statement-parser
        run: |
          python scripts/verify.py --agent-root . --parser-root mail-statement-parser
