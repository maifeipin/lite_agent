name: Android CI Build

on:
  push:
    paths:
      - 'app/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper Jar
        run: |
          if [ ! -f app/android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading missing gradle-wrapper.jar..."
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o app/android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x app/android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests and Build Debug APK
        working-directory: app/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteagent-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
